<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>
<style>
  :root{
    --bg: #FBF3E9;
    --card-bg: #FFFFFF;
    --red: #E1462B;
    --text-dark: #1E1B18;
    --text-muted: #837A72;
    --border: #EDE3D3;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ddd;
    display:flex;
    justify-content:center;
    padding: 24px 0;
  }
  .phone{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 26px 22px 30px;
    min-height: 700px;
  }
  .header{
    display:flex;
    align-items:center;
    gap: 20px;
    margin-bottom: 30px;
  }
  .icon-btn{
    width: 32px;
    height: 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header h1{
    font-size: 22px;
    font-weight: 700;
    color: var(--text-dark);
    flex: 1;
    text-align: center;
    margin-right: 32px;
  }
  .section-title{
    font-size: 17px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 16px;
  }
  .options{
    display:flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 26px;
  }
  .option{
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    display:flex;
    align-items:center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .option.selected{
    border-color: var(--red);
  }
  .option-icon{
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink: 0;
  }
  .option-info{
    flex: 1;
    min-width: 0;
  }
  .option-info h3{
    font-size: 15.5px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
  }
  .option-info p{
    font-size: 13px;
    color: var(--text-muted);
  }
  .radio{
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #D8CDBB;
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color 0.15s ease;
  }
  .option.selected .radio{
    border-color: var(--red);
  }
  .radio-dot{
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--red);
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  .option.selected .radio-dot{
    opacity: 1;
  }
  .pay-btn{
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-size: 16.5px;
    font-weight: 700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .pay-btn svg{
    width: 18px;
    height: 18px;
  }
  .secure-note{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .secure-note svg{
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <div class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Payment</h1>
  </div>

  <div class="section-title">Choose Payment Method</div>

  <div class="options">

    <div class="option selected" onclick="selectOption(this)">
      <div class="option-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 15l3-8h2l-2 6h3l4-10h2l-4 10h3l3-8h2l-3.5 9c-.3.8-1 1.3-1.9 1.3H5c-1.2 0-2-1.1-1.6-2.3z" fill="#1E1B18"/></svg>
      </div>
      <div class="option-info">
        <h3>UPI</h3>
        <p>Pay using any UPI app</p>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>

    <div class="option" onclick="selectOption(this)">
      <div class="option-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="6" width="19" height="13" rx="2.5" stroke="#1E1B18" stroke-width="1.6"/><path d="M2.5 10h19" stroke="#1E1B18" stroke-width="1.6"/><path d="M6 15h4" stroke="#1E1B18" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div class="option-info">
        <h3>Credit / Debit Card</h3>
        <p>Visa, MasterCard, RuPay</p>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>

    <div class="option" onclick="selectOption(this)">
      <div class="option-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 9l9-5 9 5" stroke="#1E1B18" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h16v2H4z" fill="#1E1B18"/><path d="M5 11v7M9 11v7M15 11v7M19 11v7" stroke="#1E1B18" stroke-width="1.6"/><path d="M3 20h18" stroke="#1E1B18" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div class="option-info">
        <h3>Net Banking</h3>
        <p>All major banks</p>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>

    <div class="option" onclick="selectOption(this)">
      <div class="option-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2" y="6" width="16" height="11" rx="2" fill="#8FBF5A"/><rect x="6" y="8.5" width="16" height="11" rx="2" fill="#7AAF48"/><circle cx="14" cy="14" r="2.4" fill="#F4EEDD"/></svg>
      </div>
      <div class="option-info">
        <h3>Cash on Pickup</h3>
        <p>Pay at the counter</p>
      </div>
      <div class="radio"><div class="radio-dot"></div></div>
    </div>

  </div>

  <button class="pay-btn">
    <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="10" rx="2" stroke="#fff" stroke-width="1.8"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
    Pay ₹370
  </button>

  <div class="secure-note">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3.5v6c0 5-3.4 8.7-8 10.5-4.6-1.8-8-5.5-8-10.5v-6L12 2z" stroke="#837A72" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 12l2.3 2.3L15.5 9.5" stroke="#837A72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Secure & Safe Payment
  </div>

</div>

<script>
  function selectOption(el){
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
  }
</script>

</body>
</html>
