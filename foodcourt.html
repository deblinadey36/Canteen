<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Court</title>
<style>
  :root{
    --bg: #FBF3E9;
    --card-bg: #FFFFFF;
    --red: #E1462B;
    --text-dark: #1E1B18;
    --text-muted: #837A72;
    --price: #E1462B;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ddd;
    display:flex;
    justify-content:center;
    padding: 24px 0;
  }
  .phone{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding-bottom: 20px;
  }
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 16px 24px 6px;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-dark);
  }
  .status-icons{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 20px 18px;
  }
  .header h1{
    font-size: 20px;
    font-weight: 700;
    color: var(--text-dark);
  }
  .icon-btn{
    width: 36px;
    height: 36px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .cart-wrap{
    position: relative;
  }
  .cart-badge{
    position:absolute;
    top: -6px;
    right: -6px;
    background: var(--red);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .tabs{
    display:flex;
    gap: 10px;
    padding: 0 20px 20px;
  }
  .tab{
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    background: #F1E7DA;
    color: var(--text-dark);
  }
  .tab.active{
    background: var(--red);
    color: #fff;
  }
  .list{
    display:flex;
    flex-direction: column;
    gap: 16px;
    padding: 0 20px;
  }
  .meal-card{
    background: var(--card-bg);
    border-radius: 20px;
    padding: 14px;
    display:flex;
    align-items:center;
    gap: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .meal-img{
    width: 92px;
    height: 92px;
    border-radius: 16px;
    object-fit: cover;
    flex-shrink: 0;
    background: #eee;
  }
  .meal-info{
    flex: 1;
    min-width: 0;
  }
  .meal-info h2{
    font-size: 17px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 4px;
  }
  .meal-info p{
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.35;
    margin-bottom: 8px;
  }
  .meal-price{
    font-size: 16px;
    font-weight: 700;
    color: var(--price);
    margin-bottom: 6px;
  }
  .meal-time{
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .meal-time svg{
    width: 14px;
    height: 14px;
  }
  .add-btn{
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink: 0;
    align-self: center;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#1E1B18"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#1E1B18"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1E1B18"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#1E1B18"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C8.6 10.5 9 10.9 9 11.5C9 12.1 8.6 12.5 8 12.5C7.4 12.5 7 12.1 7 11.5C7 10.9 7.4 10.5 8 10.5Z" fill="#1E1B18"/><path d="M4.5 8C5.4 7.1 6.6 6.6 8 6.6C9.4 6.6 10.6 7.1 11.5 8" stroke="#1E1B18" stroke-width="1.3" fill="none"/><path d="M2 5.3C3.8 3.5 5.8 2.6 8 2.6C10.2 2.6 12.2 3.5 14 5.3" stroke="#1E1B18" stroke-width="1.3" fill="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="#1E1B18"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1E1B18"/><rect x="21.5" y="4" width="1.5" height="4" rx="0.5" fill="#1E1B18"/></svg>
    </div>
  </div>

  <div class="header">
    <div class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Food Court</h1>
    <div class="icon-btn cart-wrap">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.2a2 2 0 002 1.8h8.2a2 2 0 002-1.6L21 8H6" stroke="#1E1B18" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="21" r="1.4" fill="#1E1B18"/><circle cx="18" cy="21" r="1.4" fill="#1E1B18"/></svg>
      <span class="cart-badge">2</span>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active">All</div>
    <div class="tab">Meal</div>
    <div class="tab">Combo</div>
  </div>

  <div class="list">

    <div class="meal-card">
      <img class="meal-img" src="veg-meal.png" alt="Veg Meal">
      <div class="meal-info">
        <h2>Veg Meal</h2>
        <p>Fresh veg meal with rice, dal &amp; sabzi.</p>
        <div class="meal-price">₹90</div>
        <div class="meal-time">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#837A72" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="#837A72" stroke-width="1.6" stroke-linecap="round"/></svg>
          10 min
        </div>
      </div>
      <div class="add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="meal-card">
      <img class="meal-img" src="fish-meal.png" alt="Fish Meal">
      <div class="meal-info">
        <h2>Fish Meal</h2>
        <p>Delicious fish curry with rice.</p>
        <div class="meal-price">₹110</div>
        <div class="meal-time">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#837A72" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="#837A72" stroke-width="1.6" stroke-linecap="round"/></svg>
          18 min
        </div>
      </div>
      <div class="add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="meal-card">
      <img class="meal-img" src="chicken-meal.png" alt="Chicken Meal">
      <div class="meal-info">
        <h2>Chicken Meal</h2>
        <p>Spicy chicken curry with rice.</p>
        <div class="meal-price">₹120</div>
        <div class="meal-time">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#837A72" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="#837A72" stroke-width="1.6" stroke-linecap="round"/></svg>
          20 min
        </div>
      </div>
      <div class="add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
    </div>

    <div class="meal-card">
      <img class="meal-img" src="egg-meal.png" alt="Egg Meal">
      <div class="meal-info">
        <h2>Egg Meal</h2>
        <p>Healthy egg curry with rice.</p>
        <div class="meal-price">₹70</div>
        <div class="meal-time">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#837A72" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="#837A72" stroke-width="1.6" stroke-linecap="round"/></svg>
          8 min
        </div>
      </div>
      <div class="add-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
    </div>

  </div>

</div>

</body>
</html>
