<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Your Order</title>
<style>
  :root{
    --bg: #FBF3E9;
    --card-bg: #FFFFFF;
    --red: #E1462B;
    --text-dark: #1E1B18;
    --text-muted: #837A72;
    --panel-bg: #FAEFDC;
    --badge-bg: #F3E4C6;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ddd;
    display:flex;
    justify-content:center;
    padding: 24px 0;
  }
  .phone{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 40px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 26px 20px 30px;
  }
  .header{
    display:flex;
    align-items:center;
    gap: 20px;
    margin-bottom: 22px;
  }
  .icon-btn{
    width: 32px;
    height: 32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .header h1{
    font-size: 19px;
    font-weight: 700;
    color: var(--text-dark);
    flex: 1;
    text-align: center;
    margin-right: 32px;
  }
  .panel{
    background: var(--card-bg);
    border-radius: 22px;
    padding: 20px 16px;
  }
  .panel h2{
    font-size: 16px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 14px;
  }
  .order-item{
    display:flex;
    align-items:center;
    gap: 12px;
    background: var(--bg);
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .order-item img{
    width: 64px;
    height: 64px;
    border-radius: 12px;
    object-fit: cover;
    flex-shrink: 0;
    background: #eee;
  }
  .item-info{
    flex: 1;
    min-width: 0;
  }
  .item-info h3{
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
  }
  .item-info .source{
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .item-qty{
    font-size: 14px;
    color: var(--text-dark);
    padding: 0 8px;
    flex-shrink: 0;
  }
  .item-price{
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    flex-shrink: 0;
    text-align: right;
    min-width: 48px;
  }
  .summary-block{
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 16px;
    margin-top: 16px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 14.5px;
    color: var(--text-dark);
    padding: 6px 0;
  }
  .summary-row.muted span:first-child{
    color: var(--text-muted);
  }
  .divider{
    border: none;
    border-top: 1px solid #E6D9BF;
    margin: 6px 0;
  }
  .summary-row.total span{
    font-weight: 700;
    font-size: 16px;
  }
  .summary-row.total span:last-child{
    color: var(--red);
  }
  .ready-time{
    background: var(--badge-bg);
    border-radius: 12px;
    padding: 12px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dark);
    margin-top: 12px;
  }
  .ready-time span:last-child{
    color: var(--red);
    font-weight: 700;
  }
  .pay-btn{
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 17px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 18px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <div class="icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="#1E1B18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Review Your Order</h1>
  </div>

  <div class="panel">
    <h2>Your Items</h2>

    <div class="order-item">
      <img src="veg-meal.png" alt="Veg Meal">
      <div class="item-info">
        <h3>Veg Meal</h3>
        <div class="source">Food Court</div>
      </div>
      <div class="item-qty">x1</div>
      <div class="item-price">₹80</div>
    </div>

    <div class="order-item">
      <img src="chicken-meal.png" alt="Chicken Meal">
      <div class="item-info">
        <h3>Chicken Meal</h3>
        <div class="source">Food Court</div>
      </div>
      <div class="item-qty">x1</div>
      <div class="item-price">₹130</div>
    </div>

    <div class="order-item">
      <img src="Cappuccino.png" alt="Cappuccino">
      <div class="item-info">
        <h3>Cappuccino</h3>
        <div class="source">CCD</div>
      </div>
      <div class="item-qty">x1</div>
      <div class="item-price">₹110</div>
    </div>

    <div class="order-item">
      <img src="bread-ghugni.png" alt="Bread Ghugni">
      <div class="item-info">
        <h3>Bread Ghugni</h3>
        <div class="source">Panda Junction</div>
      </div>
      <div class="item-qty">x1</div>
      <div class="item-price">₹50</div>
    </div>

    <div class="summary-block">
      <div class="summary-row muted">
        <span>Subtotal</span>
        <span>₹370</span>
      </div>
      <div class="summary-row muted">
        <span>Delivery Fee</span>
        <span>₹0</span>
      </div>
      <hr class="divider">
      <div class="summary-row total">
        <span>Total Amount</span>
        <span>₹370</span>
      </div>
      <div class="ready-time">
        <span>Estimated Ready Time</span>
        <span>20 mins</span>
      </div>
    </div>

    <button class="pay-btn">Proceed to Pay</button>
  </div>

</div>

</body>
</html>
