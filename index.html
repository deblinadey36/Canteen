<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YummyBites Food</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <!-- Top Decoration -->
    <div class="tomato t1"></div>
    <div class="tomato t2"></div>
    <div class="pea p1"></div>

    <div class="leaf-top">🍃</div>

    <!-- Logo -->
    <div class="logo">

        <!-- Chef Hat -->
        <svg width="110" height="85" viewBox="0 0 120 90">
            <g fill="none" stroke="#E89B17" stroke-width="5"
               stroke-linecap="round" stroke-linejoin="round">

                <path d="M28 45
                         C12 45 12 22 30 22
                         C34 8 50 5 60 18
                         C70 5 86 8 90 22
                         C108 22 108 45 92 45"/>

                <path d="M28 45 V62 H92 V45"/>

                <path d="M48 38 Q52 44 45 47"/>
                <path d="M72 38 Q68 44 75 47"/>

            </g>
        </svg>

        <!-- Curved Brand Name -->
        <svg width="320" height="90" viewBox="0 0 320 90" class="brand-svg">

            <defs>
                <path id="curve"
                d="M20,58 Q160,8 300,58"/>
            </defs>

            <text font-family="Lobster"
                  font-size="44"
                  fill="#D53116">

                <textPath href="#curve"
                startOffset="50%"
                text-anchor="middle">
                    YummyBites
                </textPath>

            </text>

        </svg>

        <div class="food-text">FOOD</div>

    </div>

    <!-- Tagline -->

    <div class="tagline">
        <p>Order Smart. Eat Fresh.</p>
        <p>Skip the Wait.</p>
    </div>

    <!-- Left Decoration -->

    <div class="left-food">🥟</div>

    <div class="sauce"></div>

    <!-- Food Plate -->

    <img src="images/food-plate.png"
         class="plate"
         alt="Food Plate">

    <!-- Button -->

    <button class="start-btn">
        Get Started
    </button>

</div>

</body>
</html>
