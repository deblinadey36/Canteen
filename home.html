<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YummyBites - Home</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="home.css">
</head>

<body>

<div class="phone">

    <!-- Status Bar -->
    <div class="status-bar">
        <div class="time">9:41</div>

        <div class="icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- Top Bar -->
    <div class="top-bar">
        <i class="fas fa-bars"></i>
        <i class="far fa-bell"></i>
    </div>

    <!-- Greeting -->
    <div class="header">
        <h1>Hello, Student 👋</h1>
        <p>What would you like to eat?</p>
    </div>

    <!-- Food Court -->
    <div class="card">
        <div class="text">
            <h2>Food Court</h2>
            <p>Fresh meals for your campus day.</p>
        </div>

        <img src="foodcourt.png" alt="Food Court">

        <div class="arrow">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- CCD -->
    <div class="card">
        <div class="text">
            <h2>CCD</h2>
            <p>Coffee that makes your day better.</p>
        </div>

        <img src="ccd.png" alt="CCD">

        <div class="arrow">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Panda Junction -->
    <div class="card">
        <div class="text">
            <h2>Panda Junction</h2>
            <p>Snacks & quick bites for you.</p>
        </div>

        <img src="panda.png" alt="Panda Junction">

        <div class="arrow">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Nescafe -->
    <div class="card">
        <div class="text">
            <h2>Nescafé</h2>
            <p>Pasta, Momos & more delicious bites.</p>
        </div>

        <img src="nescafe.png" alt="Nescafe">

        <div class="arrow">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">

        <div class="nav active">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </div>

        <div class="nav">
            <div class="cart-icon">
                <i class="fas fa-cart-shopping"></i>
                <div class="badge">2</div>
            </div>
            <span>Cart</span>
        </div>

        <div class="nav">
            <i class="far fa-clipboard"></i>
            <span>Orders</span>
        </div>

        <div class="nav">
            <i class="far fa-user"></i>
            <span>Profile</span>
        </div>

    </div>

</div>

</body>
</html>
