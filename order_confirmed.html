<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed</title>
<style>
  :root{
    --bg: #FBF3E9;
    --red: #E1462B;
    --text-dark: #1E1B18;
    --text-muted: #837A72;
    --panel-bg: #FAEFDC;
    --panel-bg-2: #FDFAF4;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ddd;
    display:flex;
    justify-content:center;
    padding: 24px 0;
  }
  .phone{
    width: 390px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 18px 22px 28px;
    position: relative;
  }
  .status-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 6px 2px 0;
    font-weight: 600;
    font-size: 15px;
    color: var(--text-dark);
    margin-bottom: 30px;
  }
  .status-icons{ display:flex; align-items:center; gap:6px; }

  .check-area{
    position: relative;
    height: 220px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 20px;
  }
  .check-circle{
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--red);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 2;
    animation: pop 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .check-circle svg{
    width: 60px;
    height: 60px;
  }
  @keyframes pop{
    0%{ transform: scale(0); opacity: 0; }
    70%{ transform: scale(1.08); opacity: 1; }
    100%{ transform: scale(1); }
  }
  .confetti{
    position: absolute;
    width: 12px;
    height: 4px;
    border-radius: 2px;
    opacity: 0;
    animation: burst 0.9s ease-out forwards;
  }
  @keyframes burst{
    0%{ opacity: 0; transform: translate(0,0) rotate(var(--r)) scale(0.4); }
    15%{ opacity: 1; }
    100%{ opacity: 0; transform: translate(var(--x), var(--y)) rotate(calc(var(--r) + 200deg)) scale(1); }
  }

  .title-row{
    text-align:center;
    margin-bottom: 8px;
  }
  .title-row h1{
    font-size: 25px;
    font-weight: 800;
    color: var(--text-dark);
  }
  .subtitle{
    text-align:center;
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 26px;
  }

  .order-card{
    background: var(--panel-bg-2);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.04);
  }
  .order-id{
    background: var(--panel-bg);
    padding: 18px 20px;
  }
  .order-id .label{
    font-size: 13.5px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .order-id .value{
    font-size: 22px;
    font-weight: 800;
    color: var(--text-dark);
    letter-spacing: 0.5px;
  }
  .order-rows{
    padding: 6px 20px 4px;
  }
  .order-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 14px 0;
    border-bottom: 1px solid #EFE7D8;
    font-size: 15px;
  }
  .order-row:last-child{
    border-bottom: none;
  }
  .order-row .label{
    color: var(--text-muted);
  }
  .order-row .value{
    font-weight: 700;
    color: var(--text-dark);
  }
  .order-row.time .value{
    color: var(--red);
  }

  .track-btn{
    width: 100%;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 17px;
    font-size: 16px;
    font-weight: 700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .track-btn svg{ width: 20px; height: 20px; }

  .home-link{
    display:block;
    text-align:center;
    font-size: 15.5px;
    font-weight: 700;
    color: var(--red);
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
    margin-bottom: 14px;
  }

  .home-indicator{
    width: 110px;
    height: 4px;
    background: #1E1B18;
    border-radius: 2px;
    margin: 8px auto 0;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="status-bar">
    <span>9:41</span>
    <div class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="#1E1B18"/><rect x="5" y="5" width="3" height="7" rx="0.5" fill="#1E1B18"/><rect x="10" y="3" width="3" height="9" rx="0.5" fill="#1E1B18"/><rect x="15" y="0" width="3" height="12" rx="0.5" fill="#1E1B18"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10.5C8.6 10.5 9 10.9 9 11.5C9 12.1 8.6 12.5 8 12.5C7.4 12.5 7 12.1 7 11.5C7 10.9 7.4 10.5 8 10.5Z" fill="#1E1B18"/><path d="M4.5 8C5.4 7.1 6.6 6.6 8 6.6C9.4 6.6 10.6 7.1 11.5 8" stroke="#1E1B18" stroke-width="1.3" fill="none"/><path d="M2 5.3C3.8 3.5 5.8 2.6 8 2.6C10.2 2.6 12.2 3.5 14 5.3" stroke="#1E1B18" stroke-width="1.3" fill="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="#1E1B18"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#1E1B18"/><rect x="21.5" y="4" width="1.5" height="4" rx="0.5" fill="#1E1B18"/></svg>
    </div>
  </div>

  <div class="check-area" id="checkArea">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>

  <div class="title-row">
    <h1>🎉 Order Confirmed!</h1>
  </div>
  <div class="subtitle">Your food is being prepared.</div>

  <div class="order-card">
    <div class="order-id">
      <div class="label">Order ID</div>
      <div class="value">YB12345678</div>
    </div>
    <div class="order-rows">
      <div class="order-row">
        <span class="label">Items</span>
        <span class="value">4 Items</span>
      </div>
      <div class="order-row">
        <span class="label">Total Amount</span>
        <span class="value">₹370</span>
      </div>
      <div class="order-row time">
        <span class="label">Estimated Time</span>
        <span class="value">20 min</span>
      </div>
    </div>
  </div>

  <button class="track-btn">
    <svg viewBox="0 0 24 24" fill="none"><path d="M21 8l-9-5-9 5 9 5 9-5z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 8v8l9 5 9-5V8" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 13v8" stroke="#fff" stroke-width="1.6"/></svg>
    Track Order
  </button>

  <button class="home-link">Go to Home</button>

  <div class="home-indicator"></div>

</div>

<script>
  const colors = ['#E1462B','#F2A93B','#4C8DE0','#2FA97A','#E85AA0','#7FC77C'];
  const checkArea = document.getElementById('checkArea');
  const count = 24;

  for(let i = 0; i < count; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    const angle = Math.random() * 360;
    const dist = 90 + Math.random() * 70;
    const x = Math.cos(angle * Math.PI/180) * dist;
    const y = Math.sin(angle * Math.PI/180) * dist * 0.75 - 40;
    c.style.setProperty('--x', x + 'px');
    c.style.setProperty('--y', y + 'px');
    c.style.setProperty('--r', (Math.random()*360) + 'deg');
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.left = '50%';
    c.style.top = '50%';
    c.style.animationDelay = (Math.random()*0.15) + 's';
    checkArea.appendChild(c);
  }
</script>

</body>
</html>
